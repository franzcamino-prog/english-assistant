```html id="dictv2full"
<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>English Assistant</title>

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<style>

:root{
--bg:#111827;
--card:#1f2937;
--soft:#374151;
--text:#ffffff;
--sub:#9ca3af;

}

body{
margin:0;

}

.page{

.user{

.bottom-input{

}

}

</style>

</head>

<body>

<!-- Translate -->

<div id="translate"
class="page active-page">

<div class="chat-area"
id="chatArea">

<div class="bubble ai">
Translate 功能稍后接入 AI
</div>

</div>

<div class="bottom-input">

<input
class="translate-input"
placeholder="输入中文句子...">

<button class="send-btn">
↑
</button>

</div>

</div>

<!-- Dictionary -->

<div id="dictionary"
class="page">

<div class="word-card">

<div class="word"
id="wordTitle">
hello
</div>

<div class="phonetic"
id="phonetic">
/həˈləʊ/
</div>

<div class="meaning"
id="meaning">

Hello used when meeting someone.

</div>

<div class="small-actions">

<span onclick="playAudio()">
🔊
</span>

<span onclick="saveWord()">
⭐
</span>

</div>

</div>

<div class="bottom-input">

<input
class="dict-input"
id="dictInput"
placeholder="Search word...">

<button class="send-btn"
onclick="searchWord()">
🔍
</button>

</div>

</div>

<!-- Words -->

<div id="words"
class="page">

<div id="wordList">

</div>

</div>

<!-- Phrases -->

<div id="phrases"
class="page">

<div class="saved-card">
暂无收藏短语
</div>

</div>

<!-- Settings -->

<div id="settings"
class="page">

<div class="saved-card">
English Assistant V2
</div>

</div>

<!-- Nav -->

<div class="nav">

<div class="nav-item active-nav"
onclick="showPage('translate',this)">

<div class="icon">💬</div>
Translate

</div>

<div class="nav-item"
onclick="showPage('dictionary',this)">

<div class="icon">📖</div>
Dictionary

</div>

<div class="nav-item"
onclick="showPage('words',this)">

<div class="icon">⭐</div>
Words

</div>

<div class="nav-item"
onclick="showPage('phrases',this)">

<div class="icon">📝</div>
Phrases

</div>

<div class="nav-item"
onclick="showPage('settings',this)">

<div class="icon">⚙️</div>
Settings

</div>

</div>

<script>

let currentAudio = "";

async function searchWord(){

const word =
document.getElementById('dictInput')
.value.trim();

if(!word) return;

try{

const response =
await fetch(
`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`
);

const data =
await response.json();

const result = data[0];

document.getElementById('wordTitle')
.innerText = result.word;

let phonetic = "";

if(result.phonetics){

const p =
result.phonetics.find(
x=>x.text
);

if(p){

phonetic = p.text || "";

currentAudio = p.audio || "";

}

}

document.getElementById('phonetic')
.innerText = phonetic;

const meaning =
result.meanings[0];

const def =
meaning.definitions[0];

document.getElementById('meaning')
.innerHTML =
`
<b>${meaning.partOfSpeech}</b>

<br><br>

${def.definition}

<br><br>

${def.example || ""}
`;

}catch(err){

document.getElementById('meaning')
.innerHTML =
"Word not found.";

}

}

function playAudio(){

if(currentAudio){

const audio =
new Audio(currentAudio);

audio.play();

}else{

const text =
document.getElementById('wordTitle')
.innerText;

const u =
new SpeechSynthesisUtterance(text);

u.lang='en-US';

speechSynthesis.speak(u);

}

}

function saveWord(){

const word =
document.getElementById('wordTitle')
.innerText;

const list =
document.getElementById('wordList');

const item =
document.createElement('div');

item.className='saved-card';

item.innerHTML=
`
<div class="saved-word">
${word}
</div>

<div class="saved-sub">
已收藏
</div>
`;

list.prepend(item);

localStorage.setItem(
'words',
list.innerHTML
);

}

function loadWords(){

const saved =
localStorage.getItem('words');

if(saved){

document.getElementById('wordList')
.innerHTML = saved;

}

}

function showPage(id,el){

document
.querySelectorAll('.page')
.forEach(p=>p.classList.remove('active-page'));

document
.getElementById(id)
.classList.add('active-page');

document
.querySelectorAll('.nav-item')
.forEach(n=>n.classList.remove('active-nav'));

el.classList.add('active-nav');

}

loadWords();

</script>

</body>

</html>
