```html
<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>English Assistant</title>

<meta name="theme-color" content="#111827">

<style>

:root{
--bg:#111827;

.page{

}

</head>

<body>

<!-- Translate -->

<div id="translate"
class="page active">

<div class="chat-area"
id="chatArea">

<div class="bubble ai">
输入中文，我会给出更地道的英语表达。
</div>

</div>

<div class="search-bar">

<input
class="search-input"
placeholder="输入中文句子...">

<button class="search-btn">
↑
</button>

</div>

</div>

<!-- Dictionary -->

<div id="dictionary"
class="page">

<div class="word-detail">

<div class="word-title"
id="wordTitle">
exhausted
</div>

<div class="phonetic">

<span id="phonetic">
/ɪɡˈzɔːstɪd/
</span>

<span class="small-icon"
onclick="playAudio()">
🔊
</span>

<span class="small-icon"
onclick="saveWord()">
☆
</span>

</div>

<div class="meaning"
id="meaning">

<b>adj.</b>

筋疲力尽的；极度疲惫的

</div>

<div class="example"
id="example">

She felt completely exhausted after work.

<br><br>

她下班后累坏了。

</div>

</div>

<div class="search-bar">

<input
class="search-input"
id="dictInput"
placeholder="Search word...">

<button
class="search-btn"
onclick="searchWord()">
⌕
</button>

</div>

</div>

<!-- Words -->

<div id="words"
class="page">

<div class="top-title">
生词本
</div>

<div id="wordList">

<div class="list-item"
onclick="openWord('exhausted')">

<div class="list-left">

<div class="list-word">
exhausted
</div>

<div class="list-meaning">
adj. 疲惫的
</div>

</div>

<div class="small-icon">
🔊
</div>

</div>

</div>

</div>

<!-- Phrases -->

<div id="phrases"
class="page">

<div class="top-title">
短语收藏
</div>

</div>

<!-- Settings -->

<div id="settings"
class="page">

<div class="top-title">
设置
</div>

</div>

<!-- Nav -->

<div class="nav">

<div class="nav-item active-nav"
onclick="showPage('translate',this)">

<div class="nav-icon">💬</div>
Translate

</div>

<div class="nav-item"
onclick="showPage('dictionary',this)">

<div class="nav-icon">📖</div>
Dictionary

</div>

<div class="nav-item"
onclick="showPage('words',this)">

<div class="nav-icon">⭐</div>
Words

</div>

<div class="nav-item"
onclick="showPage('phrases',this)">

<div class="nav-icon">📝</div>
Phrases

</div>

<div class="nav-item"
onclick="showPage('settings',this)">

<div class="nav-icon">⚙️</div>
Settings

</div>

</div>

<script>

let currentAudio = "";

async function searchWord(){

const word =
document.getElementById('dictInput')
.value.trim();

if(!word) return;

try{

const response =
await fetch(
`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`
);

const data =
await response.json();

const result = data[0];

document.getElementById('wordTitle')
.innerText = result.word;

let phonetic = "";

if(result.phonetics){

const p =
result.phonetics.find(x=>x.text);

if(p){

phonetic = p.text || "";
currentAudio = p.audio || "";

}

}

document.getElementById('phonetic')
.innerText = phonetic;

const meaning =
result.meanings[0];

const def =
meaning.definitions[0];

document.getElementById('meaning')
.innerHTML =
`
<b>${meaning.partOfSpeech}</b>

${def.definition}
`;

document.getElementById('example')
.innerHTML =
`
${def.example || "No example"}

<br><br>

（中文翻译稍后接入）
`;

}catch(err){

document.getElementById('meaning')
.innerHTML =
"Word not found.";

}

}

function playAudio(){

if(currentAudio){

new Audio(currentAudio).play();

}else{

const u =
new SpeechSynthesisUtterance(
document.getElementById('wordTitle')
.innerText
);

u.lang='en-US';

speechSynthesis.speak(u);

}

}

function saveWord(){

const word =
document.getElementById('wordTitle')
.innerText;

const meaning =
document.getElementById('meaning')
.innerText;

const list =
document.getElementById('wordList');

const item =
document.createElement('div');

item.className='list-item';

item.innerHTML=
`
<div class="list-left">

<div class="list-word">
${word}
</div>

<div class="list-meaning">
${meaning}
</div>

</div>

<div class="small-icon">
🔊
</div>
`;

list.prepend(item);

localStorage.setItem(
'wordList',
list.innerHTML
);

}

function openWord(word){

showPage(
'dictionary',
document.querySelectorAll('.nav-item')[1]
);

document.getElementById('dictInput')
.value = word;

searchWord();

}

function loadWords(){

const saved =
localStorage.getItem('wordList');

if(saved){

document.getElementById('wordList')
.innerHTML = saved;

}

}

function showPage(id,el){

document
.querySelectorAll('.page')
.forEach(p=>p.classList.remove('active'));

document
.getElementById(id)
.classList.add('active');

document
.querySelectorAll('.nav-item')
.forEach(n=>n.classList.remove('active-nav'));

el.classList.add('active-nav');

}

loadWords();

</script>

</body>

</html>
